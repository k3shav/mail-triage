# docker compose up -d --build
# Requires a .env file (copy .env.example). APP_PASSWORD is mandatory in the container
# because it listens on 0.0.0.0 inside the container.
services:
  mail-triage:
    build: .
    image: mail-triage:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
    ports:
      # Published on the host's loopback only. For remote access, put an HTTPS
      # reverse proxy in front instead of publishing on 0.0.0.0.
      - "127.0.0.1:8787:8787"
    volumes:
      - mail-triage-data:/data

volumes:
  mail-triage-data:
