name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Installed CLI bin runs
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/mail-triage-*.tgz
          DATA_DIR="$RUNNER_TEMP/cli-data" ./node_modules/.bin/mail-triage --help

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mail-triage:ci .
      - name: Refuses to start without APP_PASSWORD
        run: |
          if docker run --rm mail-triage:ci; then echo "expected failure"; exit 1; fi
      - name: Serves health check with a password
        run: |
          docker run -d --name mt -p 127.0.0.1:8787:8787 -e APP_PASSWORD=ci-password-123456 mail-triage:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/api/health && break; sleep 1; done
          curl -fsS http://localhost:8787/api/health
          docker rm -f mt
